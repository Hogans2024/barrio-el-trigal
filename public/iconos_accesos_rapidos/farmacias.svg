<svg xmlns="http://www.w3.org/2000/svg" viewBox="7.5 7 55 52">
	<!-- Icono Farmacias del dueño, geometría exacta de su componente IconFarmacias
	     (Rect cápsula rotada -40°, línea media, cruz superior). Convertido de
	     react-native-svg a SVG web 1:1. Solo cambia el color a #FFD700 fijo
	     (los <img> no heredan currentColor) y stroke-width 3 para igualar el
	     grosor visual de los otros 3 iconos del tile a 28px de alto. -->
	<!-- Trazo 2.4 en cápsula y cruz para igualar el grosor visual de los otros
	     3 iconos a 32px de alto (≈1.5px). Geometría intacta. -->
	<g fill="none" stroke="#FFD700" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
		<rect x="12" y="26" width="48" height="20" rx="10" transform="rotate(-40 36 36)" />
		<path d="M36 26v20" transform="rotate(-40 36 36)" />
	</g>
	<g fill="none" stroke="#FFD700" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
		<path d="M13 8.5h5v5h5v5h-5v5h-5v-5H8v-5h5Z" />
	</g>
</svg>
